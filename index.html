<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pickljay Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<meta name="description" content="Sign in to the class pickleball tournament.">
<style>
/* Layout: a courtside instrument panel — translucent strata over a faint
   court-line grid, with electric accents held back for live state and rank. */
:root{
  --bg:#eef1ed; --bg-2:#e5eae4; --grid:rgba(20,40,26,.055);
  --panel:#ffffff; --panel-2:#f1f4ef; --glass:rgba(255,255,255,.74);
  --line:#d6ddd2; --line-2:#c0ccb9;
  --ink:#111a13; --ink-2:#4c5a4c; --ink-3:#7c8a7b;
  --accent:#2f7a1f; --accent-ink:#ffffff; --accent-soft:#e2f2d8; --glow:rgba(47,122,31,.22);
  --live:#0d8a80; --warn:#a2560f; --warn-soft:#fdeeda; --danger:#a32a2a;
  --r:11px; --r-sm:8px;
  --shadow:0 1px 1px rgba(16,30,18,.04), 0 10px 28px rgba(16,30,18,.07);
  --f-display:"Rajdhani",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --f-body:"Barlow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#080c0a; --bg-2:#0c120e; --grid:rgba(142,240,74,.05);
  --panel:#121a15; --panel-2:#18231b; --glass:rgba(18,26,21,.80);
  --line:#243227; --line-2:#35472f;
  --ink:#e9f1e5; --ink-2:#9fb09c; --ink-3:#6e8070;
  --accent:#8ef04a; --accent-ink:#07160a; --accent-soft:#1c2c15; --glow:rgba(142,240,74,.28);
  --live:#2ae0c8; --warn:#ffab49; --warn-soft:#3a2a14; --danger:#ff7a7a;
  --shadow:0 1px 1px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
} }
:root[data-theme="dark"]{
  --bg:#080c0a; --bg-2:#0c120e; --grid:rgba(142,240,74,.05);
  --panel:#121a15; --panel-2:#18231b; --glass:rgba(18,26,21,.80);
  --line:#243227; --line-2:#35472f;
  --ink:#e9f1e5; --ink-2:#9fb09c; --ink-3:#6e8070;
  --accent:#8ef04a; --accent-ink:#07160a; --accent-soft:#1c2c15; --glow:rgba(142,240,74,.28);
  --live:#2ae0c8; --warn:#ffab49; --warn-soft:#3a2a14; --danger:#ff7a7a;
  --shadow:0 1px 1px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box} html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;display:flex;align-items:center;justify-content:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
h1{margin:0;font-size:21px;font-weight:680;letter-spacing:-.02em}
.wrap{width:min(420px,100%)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ball{width:40px;height:40px;border-radius:50%;background:var(--accent);flex:none;
  background-image:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55) 0 3px,transparent 4px),
    radial-gradient(circle at 70% 26%,rgba(255,255,255,.5) 0 3px,transparent 4px),
    radial-gradient(circle at 50% 60%,rgba(255,255,255,.5) 0 3px,transparent 4px),
    radial-gradient(circle at 26% 70%,rgba(255,255,255,.45) 0 3px,transparent 4px),
    radial-gradient(circle at 74% 70%,rgba(255,255,255,.45) 0 3px,transparent 4px)}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:20px}
.seg{display:flex;background:var(--panel-2);border-radius:11px;padding:3px;gap:3px;margin-bottom:18px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink-2);padding:9px 8px;
  border-radius:9px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
label{display:block;font-size:12px;font-weight:650;color:var(--ink-2);margin:0 0 5px;
  text-transform:uppercase;letter-spacing:.05em}
input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:12px 13px;font:inherit;font-size:16px;color:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.field{margin-bottom:14px}
.btn{width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:11px;
  padding:13px;font:inherit;font-size:15px;font-weight:650;cursor:pointer}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line);font-weight:600}
.msg{margin-top:14px;padding:11px 13px;border-radius:11px;font-size:13.5px;font-weight:550;display:none}
.msg.show{display:block}
.msg.bad{background:var(--warn-soft);color:var(--warn)}
.msg.good{background:var(--accent-soft);color:var(--accent)}
.hint{font-size:12.5px;color:var(--ink-3);margin:14px 0 0;text-align:center}
.setup{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:14px;
  font-size:13px;line-height:1.6}
.setup code{background:rgba(0,0,0,.08);padding:1px 5px;border-radius:5px;font-size:12px}
.row{display:flex;gap:9px;align-items:center}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;
  border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spin{animation:none} }

/* --- hi-tech surface treatment --- */
body{background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:52px 52px,52px 52px;background-attachment:fixed;
  font-family:var(--f-body)}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.005em}
.topbar{background:var(--glass);backdrop-filter:saturate(140%) blur(14px);
  -webkit-backdrop-filter:saturate(140%) blur(14px)}
.card-h{background:linear-gradient(180deg,var(--panel-2),transparent);position:relative}
.card-h::after{content:"";position:absolute;left:0;bottom:-1px;width:64px;height:2px;background:var(--accent)}
.pill{font-family:var(--f-display);letter-spacing:.06em;font-weight:600;border:1px solid var(--line)}
.pill.live{border-color:color-mix(in srgb,var(--live) 34%,transparent)}
.pill.final,.pill.done{border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.btn{font-family:var(--f-display);letter-spacing:.03em;font-weight:600}
.btn.primary{box-shadow:0 0 0 1px var(--glow),0 3px 14px var(--glow)}
th{font-family:var(--f-display);letter-spacing:.11em;font-weight:600}
td.num,th.num,.num,.sc,.big,.fin,.gcount{font-variant-numeric:tabular-nums}
td.num,.sc,.fin,.big{font-family:var(--f-mono)}
.brand b,.topbar b{font-family:var(--f-display);letter-spacing:.01em}
.side .tname,.court-h,.court-tag{font-family:var(--f-display);letter-spacing:.09em}
.bar i{background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--live)));
  box-shadow:0 0 10px var(--glow)}
.medal.m1,.rank.top{box-shadow:0 0 16px var(--glow)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="ball"></div>
    <div><h1>Pickljay</h1><p id="sub">Class pickleball tournament</p></div>
  </div>

  <div class="card" id="card">
    <div id="boot" class="row" style="color:var(--ink-3);font-size:13.5px">
      <span class="spin"></span> Checking&hellip;
    </div>

    <form id="form" hidden autocomplete="on">
      <div class="seg" role="tablist">
        <button type="button" role="tab" data-as="general" aria-selected="true">I'm a student</button>
        <button type="button" role="tab" data-as="admin" aria-selected="false">I'm the teacher</button>
      </div>

      <div class="field" id="emailField" hidden>
        <label for="email">Teacher email</label>
        <input id="email" type="email" autocomplete="username" spellcheck="false">
      </div>

      <div class="field">
        <label for="pass" id="passLabel">Class password</label>
        <input id="pass" type="password" autocomplete="current-password" required>
      </div>

      <div class="field" id="slugField">
        <label for="slug">Class code</label>
        <input id="slug" type="text" autocomplete="off" spellcheck="false">
      </div>

      <button class="btn" id="go" type="submit">Sign in</button>
      <div class="msg" id="msg"></div>
      <p class="hint" id="hint">Everyone in the class uses the same student password.</p>
    </form>

    <div id="setup" hidden>
      <div class="setup">
        <b>Not set up yet.</b><br>
        Open <code>firebase-config.js</code> and paste in the settings from your
        Firebase console, then reload this page. The file
        <code>SETUP.md</code> in the repository walks through every step.
      </div>
    </div>

    <div id="already" hidden>
      <p style="margin:0 0 14px;font-size:14px">Signed in as <b id="whoami"></b>.</p>
      <div class="row">
        <button class="btn" id="goOn" style="flex:2">Continue</button>
        <button class="btn ghost" id="out" style="flex:1">Sign out</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="db.js"></script>
<script>
"use strict";
var $=function(s){return document.querySelector(s);};
var CFG=window.PJ_CONFIG||{};
var AS="general";

function slugFromUrl(){
  var h=(location.hash||"").replace(/^#/,"").trim();
  if(/^[a-z0-9][a-z0-9-]{2,63}$/i.test(h)) return h.toLowerCase();
  try{ var s=localStorage.getItem("pj-slug"); if(s) return s; }catch(e){}
  return CFG.defaultSlug||"";
}
function destFor(role){ return role==="admin" ? "app.html" : "board.html"; }
function say(text,good){
  var m=$("#msg");
  m.textContent=text;
  m.className="msg show "+(good?"good":"bad");
}
function clearMsg(){ $("#msg").className="msg"; }

function setMode(as){
  AS=as;
  document.querySelectorAll("[data-as]").forEach(function(b){
    b.setAttribute("aria-selected", b.dataset.as===as ? "true":"false");
  });
  $("#emailField").hidden = (as!=="admin");
  $("#passLabel").textContent = as==="admin" ? "Your password" : "Class password";
  $("#hint").textContent = as==="admin"
    ? "This is the account only you use."
    : "Everyone in the class uses the same student password.";
  if(as==="admin" && !$("#email").value) $("#email").value=CFG.adminEmail||"";
  clearMsg();
}

function showForm(){
  $("#boot").hidden=true; $("#form").hidden=false;
  $("#slug").value=slugFromUrl();
  setMode("general");
  setTimeout(function(){ $("#pass").focus(); },50);
}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-as]");
  if(t) return setMode(t.dataset.as);
  if(e.target.id==="out"){
    PJ.signOut().then(function(){ location.reload(); });
  }
  if(e.target.id==="goOn"){
    var u=PJ.currentUser();
    if(u) location.href=destFor(u.role);
  }
});

$("#form").addEventListener("submit",function(e){
  e.preventDefault();
  var slug=($("#slug").value||"").trim().toLowerCase();
  var pass=$("#pass").value;
  if(!slug) return say("Enter the class code your teacher gave you.");
  if(!pass)  return say("Enter the password.");
  var email = AS==="admin" ? ($("#email").value||"").trim() : (CFG.studentEmail||"");
  if(!email) return say(AS==="admin"
    ? "Enter your teacher email."
    : "No student account is set in firebase-config.js yet.");

  var btn=$("#go");
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> Signing in…';
  clearMsg();

  PJ.signIn(email,pass).then(function(u){
    try{ localStorage.setItem("pj-slug",slug); }catch(err){}
    if(AS==="admin" && u.role!=="admin"){
      say("That account is not the teacher account. Check the admin address in firebase-config.js.");
      btn.disabled=false; btn.textContent="Sign in";
      return;
    }
    say("Signed in. Taking you there…",true);
    location.href=destFor(u.role);
  }).catch(function(err){
    say(PJ.explain(err));
    btn.disabled=false; btn.textContent="Sign in";
    $("#pass").select();
  });
});

(function init(){
  if(CFG.defaultSlug) $("#sub").textContent=String(CFG.defaultSlug).toUpperCase()+" pickleball tournament";
  if(!PJ.configured){
    $("#boot").hidden=true;
    if(PJ.failure==="setup"){ $("#setup").hidden=false; }
    else {
      $("#form").hidden=false;
      $("#slug").value=slugFromUrl();
      say(PJ.failure||"Could not start.");
      $("#go").disabled=true;
    }
    return;
  }
  PJ.onAuth(function(u){
    if(u){
      $("#boot").hidden=true;
      $("#already").hidden=false;
      $("#whoami").textContent=(u.role==="admin"?"the teacher":"a student")+" ("+u.email+")";
      var slug=slugFromUrl();
      try{ if(slug) localStorage.setItem("pj-slug",slug); }catch(e){}
      setTimeout(function(){
        if(!document.hidden) location.replace(destFor(u.role));
      },900);
    } else {
      showForm();
    }
  });
})();
</script>
</body>
</html>
